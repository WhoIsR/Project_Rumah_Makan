name: Deploy to Production

on:
  push:
    branches: ["main"]

# Prevent concurrent deploys
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ─── Build front-end assets locally (avoids Node on the server) ──────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      # ─── SSH deploy ────────────────────────────────────────────────────────
      # Secrets required in GitHub → Settings → Environments → production:
      #   DEPLOY_HOST     — server IP or hostname
      #   DEPLOY_USER     — SSH user (e.g. deploy)
      #   DEPLOY_SSH_KEY  — private key (RSA / ED25519)
      #   DEPLOY_PATH     — absolute path on server (e.g. /var/www)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            bash deploy.sh

      # ─── Docker-based alternative ─────────────────────────────────────────
      # Uncomment this block (and comment out the SSH block above) if you
      # deploy via Docker Hub + docker-compose on the server.
      #
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     push: true
      #     tags: ${{ secrets.DOCKERHUB_USERNAME }}/rumah-makan:latest
      #
      # - name: Pull and restart on server
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PATH }}
      #       docker compose pull
      #       docker compose up -d --remove-orphans
      #       docker compose exec app php artisan migrate --force
      #       docker compose exec app php artisan config:cache
      #       docker compose exec app php artisan route:cache
      #       docker compose exec app php artisan view:cache

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Notify deployment failure
        run: |
          echo "::error::Production deployment failed. Check the logs above."
