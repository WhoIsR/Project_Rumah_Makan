; ─── PHP production settings ───────────────────────────────────────────────────
[PHP]
; Error handling — never expose errors in production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limits
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; Session security
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = 1

; OPcache — dramatically speeds up PHP
[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=0 gives maximum performance but requires a container
; restart (or opcache_reset()) after each deployment for changes to take effect.
; Set to 1 with revalidate_freq=0 if you need hot reloads during deployments.
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.validate_timestamps = 0
